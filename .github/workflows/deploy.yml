name: Build and deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Never run two deployments at the same time
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  build:
    name: Test and build image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -B verify

      - name: Image name (GHCR needs lowercase)
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest

  deploy:
    name: Deploy to EC2
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
    steps:
      - name: Check required secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          missing=0
          for name in EC2_HOST EC2_USER EC2_SSH_KEY OPENWEATHER_API_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set"; missing=1; fi
          done
          exit $missing

      - name: Set up SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -T 20 -H "$EC2_HOST" >> ~/.ssh/known_hosts
          printf 'Host ec2\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/ec2.pem\n  ServerAliveInterval 30\n' \
            "$EC2_HOST" "${{ secrets.EC2_USER }}" > ~/.ssh/config

      - name: Upload app environment file
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        # Sent over stdin so the key never appears in a command line or log
        run: |
          printf 'OPENWEATHER_API_KEY=%s\n' "$OPENWEATHER_API_KEY" \
            | ssh ec2 'mkdir -p ~/wfa && umask 077 && cat > ~/wfa/app.env'

      - name: Pull and restart container
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh ec2 "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh ec2 "IMAGE='$IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          docker pull "$IMAGE"
          docker rm -f wfa 2>/dev/null || true
          docker run -d --name wfa \
            --restart unless-stopped \
            --env-file ~/wfa/app.env \
            -p 80:8080 \
            "$IMAGE"
          docker logout ghcr.io
          docker image prune -af --filter "until=72h" || true
          REMOTE

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://${{ secrets.EC2_HOST }}/actuator/health"; then
              echo; echo "Live at http://${{ secrets.EC2_HOST }}"; exit 0
            fi
            sleep 5
          done
          echo "::error::App did not become healthy"
          ssh ec2 'docker logs --tail 100 wfa' || true
          exit 1
