name: CI

# Runs the backend tests. The live site is published by GitHub Pages
# ("Deploy from a branch": main, / root) — index.html at the repo root
# opens the web UI in src/main/resources/static/.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -B verify
