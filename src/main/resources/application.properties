# OpenWeatherMap Configuration
# The key is read from the OPENWEATHER_API_KEY environment variable - never commit a real key.
openweathermap.api-key=${OPENWEATHER_API_KEY:}

server.port=${PORT:8080}

# H2 Database Configuration (for simple caching)
spring.datasource.url=jdbc:h2:mem:weatherdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Actuator: health check for deployments, Prometheus metrics for Grafana
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
